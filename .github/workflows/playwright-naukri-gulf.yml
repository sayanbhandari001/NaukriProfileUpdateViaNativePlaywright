name: Naukri & Gulf Profile Update

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * *'

jobs:
  playwright-tests:
    name: Run Playwright Tests
    timeout-minutes: 60        # 120 is excessive for 5 tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci
      - run: npx playwright install --with-deps
      - run: sudo apt-get install -y xvfb

      - name: Run tests
        env:
          GULF_NAUKRI_EMAIL: ${{ secrets.GULF_NAUKRI_EMAIL }}
          GULF_NAUKRI_PASSWORD: ${{ secrets.GULF_NAUKRI_PASSWORD }}
          NAUKRI_USER_1_EMAIL: ${{ secrets.NAUKRI_USER_1_EMAIL }}
          NAUKRI_USER_1_PASSWORD: ${{ secrets.NAUKRI_USER_1_PASSWORD }}
          NAUKRI_USER_2_EMAIL: ${{ secrets.NAUKRI_USER_2_EMAIL }}
          NAUKRI_USER_2_PASSWORD: ${{ secrets.NAUKRI_USER_2_PASSWORD }}
          NAUKRI_USER_3_EMAIL: ${{ secrets.NAUKRI_USER_3_EMAIL }}
          NAUKRI_USER_3_PASSWORD: ${{ secrets.NAUKRI_USER_3_PASSWORD }}
          NAUKRI_WIFE_EMAIL: ${{ secrets.NAUKRI_WIFE_EMAIL }}
          NAUKRI_WIFE_PASSWORD: ${{ secrets.NAUKRI_WIFE_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30