name: Naukri & Gulf Profile Update

on:
  schedule:
    # GitHub cron is UTC. IST = UTC+5:30 → 10:30, 12:30, 15:30 IST, Monday–Saturday
    - cron: '0 5,7,10 * * 1-6'
  workflow_dispatch:

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  playwright-tests:
    name: Run Playwright Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      GULF_NAUKRI_EMAIL: ${{ secrets.GULF_NAUKRI_EMAIL }}
      GULF_NAUKRI_PASSWORD: ${{ secrets.GULF_NAUKRI_PASSWORD }}
      NAUKRI_USER_1_EMAIL: ${{ secrets.NAUKRI_USER_1_EMAIL }}
      NAUKRI_USER_1_PASSWORD: ${{ secrets.NAUKRI_USER_1_PASSWORD }}
      NAUKRI_USER_2_EMAIL: ${{ secrets.NAUKRI_USER_2_EMAIL }}
      NAUKRI_USER_2_PASSWORD: ${{ secrets.NAUKRI_USER_2_PASSWORD }}
      NAUKRI_USER_3_EMAIL: ${{ secrets.NAUKRI_USER_3_EMAIL }}
      NAUKRI_USER_3_PASSWORD: ${{ secrets.NAUKRI_USER_3_PASSWORD }}
      NAUKRI_WIFE_EMAIL: ${{ secrets.NAUKRI_WIFE_EMAIL }}
      NAUKRI_WIFE_PASSWORD: ${{ secrets.NAUKRI_WIFE_PASSWORD }}
      BAYT_EMAIL: ${{ secrets.BAYT_EMAIL }}
      BAYT_PASSWORD: ${{ secrets.BAYT_PASSWORD }}
      FOUNDIT_EMAIL: ${{ secrets.FOUNDIT_EMAIL }}
      FOUNDIT_PASSWORD: ${{ secrets.FOUNDIT_PASSWORD }}
      GULFTALENT_EMAIL: ${{ secrets.GULFTALENT_EMAIL }}
      GULFTALENT_PASSWORD: ${{ secrets.GULFTALENT_PASSWORD }}
      INDEED_EMAIL: ${{ secrets.INDEED_EMAIL }}
      INDEED_PASSWORD: ${{ secrets.INDEED_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb

      - name: Check secrets are available
        run: |
          missing=0
          for name in GULF_NAUKRI_EMAIL GULF_NAUKRI_PASSWORD \
                      NAUKRI_USER_1_EMAIL NAUKRI_USER_1_PASSWORD \
                      NAUKRI_USER_2_EMAIL NAUKRI_USER_2_PASSWORD \
                      NAUKRI_USER_3_EMAIL NAUKRI_USER_3_PASSWORD \
                      NAUKRI_WIFE_EMAIL NAUKRI_WIFE_PASSWORD \
                      BAYT_EMAIL BAYT_PASSWORD \
                      FOUNDIT_EMAIL FOUNDIT_PASSWORD \
                      GULFTALENT_EMAIL GULFTALENT_PASSWORD; do
            if [ -n "${!name}" ]; then echo "✓ $name is set"; else echo "✗ $name is NOT set"; missing=1; fi
          done
          # Indeed is optional — the spec skips itself when the credentials are absent
          for name in INDEED_EMAIL INDEED_PASSWORD; do
            if [ -n "${!name}" ]; then echo "✓ $name is set"; else echo "- $name is not set (Indeed test will be skipped)"; fi
          done
          exit $missing

      # Headed under a virtual display — the portals block headless Chromium.
      # india + international cover every test exactly once (priority-* projects would re-run them).
      - name: Run tests
        run: xvfb-run --auto-servernum npx playwright test --project=india --project=international

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
