name: Profile Update (GitHub-hosted, IST schedule)

on:
  workflow_dispatch:
  schedule:
    # UTC -> 10:30 AM, 12:30 PM, 3:30 PM IST, Monday through Saturday.
    - cron: '0 5,7,10 * * 1-6'

permissions:
  contents: read

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  playwright-tests:
    name: Run Playwright Tests
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    env:
      TZ: Asia/Kolkata
      GULF_NAUKRI_EMAIL: ${{ secrets.GULF_NAUKRI_EMAIL }}
      GULF_NAUKRI_PASSWORD: ${{ secrets.GULF_NAUKRI_PASSWORD }}
      NAUKRI_USER_1_EMAIL: ${{ secrets.NAUKRI_USER_1_EMAIL }}
      NAUKRI_USER_1_PASSWORD: ${{ secrets.NAUKRI_USER_1_PASSWORD }}
      NAUKRI_USER_2_EMAIL: ${{ secrets.NAUKRI_USER_2_EMAIL }}
      NAUKRI_USER_2_PASSWORD: ${{ secrets.NAUKRI_USER_2_PASSWORD }}
      NAUKRI_USER_3_EMAIL: ${{ secrets.NAUKRI_USER_3_EMAIL }}
      NAUKRI_USER_3_PASSWORD: ${{ secrets.NAUKRI_USER_3_PASSWORD }}
      BAYT_EMAIL: ${{ secrets.BAYT_EMAIL }}
      BAYT_PASSWORD: ${{ secrets.BAYT_PASSWORD }}
      FOUNDIT_EMAIL: ${{ secrets.FOUNDIT_EMAIL }}
      FOUNDIT_PASSWORD: ${{ secrets.FOUNDIT_PASSWORD }}
      FOUNDIT_GULF_EMAIL: ${{ secrets.FOUNDIT_GULF_EMAIL }}
      FOUNDIT_GULF_PASSWORD: ${{ secrets.FOUNDIT_GULF_PASSWORD }}
      GULFTALENT_EMAIL: ${{ secrets.GULFTALENT_EMAIL }}
      GULFTALENT_PASSWORD: ${{ secrets.GULFTALENT_PASSWORD }}
      INDEED_EMAIL: ${{ secrets.INDEED_EMAIL }}
      INDEED_PASSWORD: ${{ secrets.INDEED_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Check secrets are available
        run: |
          missing=0
          for name in GULF_NAUKRI_EMAIL GULF_NAUKRI_PASSWORD \
                      NAUKRI_USER_1_EMAIL NAUKRI_USER_1_PASSWORD \
                      NAUKRI_USER_2_EMAIL NAUKRI_USER_2_PASSWORD \
                      NAUKRI_USER_3_EMAIL NAUKRI_USER_3_PASSWORD \
                      BAYT_EMAIL BAYT_PASSWORD \
                      FOUNDIT_EMAIL FOUNDIT_PASSWORD \
                      GULFTALENT_EMAIL GULFTALENT_PASSWORD; do
            if [ -n "${!name}" ]; then echo "✓ $name is set"; else echo "✗ $name is NOT set"; missing=1; fi
          done
          # Optional credentials — those specs skip themselves when the values are absent
          for name in INDEED_EMAIL INDEED_PASSWORD FOUNDIT_GULF_EMAIL FOUNDIT_GULF_PASSWORD; do
            if [ -n "${!name}" ]; then echo "✓ $name is set"; else echo "- $name is not set (that test will be skipped)"; fi
          done
          # An optional portal must have both credentials or neither.
          for prefix in INDEED FOUNDIT_GULF; do
            email_key="${prefix}_EMAIL"
            password_key="${prefix}_PASSWORD"
            if { [ -n "${!email_key}" ] && [ -z "${!password_key}" ]; } ||
               { [ -z "${!email_key}" ] && [ -n "${!password_key}" ]; }; then
              echo "::error::Set both ${email_key} and ${password_key}, or leave both unset."
              missing=1
            fi
          done
          exit $missing

      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb

      # Preserve the project's headed browser behavior on a virtual display.
      # india + international cover every test exactly once (priority-* projects would re-run them).
      - name: Run tests
        run: xvfb-run --auto-servernum npm run test:ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
