name: Naukri & Gulf Profile Update Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC

jobs:
  playwright-tests:
    name: Run Playwright Tests
    timeout-minutes: 120
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Ensure Xvfb is available
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Playwright tests (use Xvfb for headed)
        env:
          # Gulf Naukri Credentials
          GULF_NAUKRI_EMAIL: ${{ secrets.GULF_NAUKRI_EMAIL }}
          GULF_NAUKRI_PASSWORD: ${{ secrets.GULF_NAUKRI_PASSWORD }}
          
          # India Naukri User 1
          NAUKRI_USER_1_EMAIL: ${{ secrets.NAUKRI_USER_1_EMAIL }}
          NAUKRI_USER_1_PASSWORD: ${{ secrets.NAUKRI_USER_1_PASSWORD }}
          
          # India Naukri User 2
          NAUKRI_USER_2_EMAIL: ${{ secrets.NAUKRI_USER_2_EMAIL }}
          NAUKRI_USER_2_PASSWORD: ${{ secrets.NAUKRI_USER_2_PASSWORD }}
          
          # India Naukri User 3
          NAUKRI_USER_3_EMAIL: ${{ secrets.NAUKRI_USER_3_EMAIL }}
          NAUKRI_USER_3_PASSWORD: ${{ secrets.NAUKRI_USER_3_PASSWORD }}
          
          # India Naukri Wife Account
          NAUKRI_WIFE_EMAIL: ${{ secrets.NAUKRI_WIFE_EMAIL }}
          NAUKRI_WIFE_PASSWORD: ${{ secrets.NAUKRI_WIFE_PASSWORD }}
        run: xvfb-run --auto-servernum --server-args='-screen 0 1360x768x24' npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testReportPath = './playwright-report/index.html';
            if (fs.existsSync(testReportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ Playwright tests completed. Check the artifacts for detailed reports.'
              });
            }

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: playwright-tests
    if: always()

    steps:
      - name: Check test status
        if: ${{ needs.playwright-tests.result == 'failure' }}
        run: |
          echo "❌ Some tests failed"
          exit 1

      - name: Success notification
        if: ${{ needs.playwright-tests.result == 'success' }}
        run: echo "✅ All tests passed successfully!"
