name: Profile Update (self-hosted)

# Runs the full suite from a self-hosted runner on a home IP. Naukri and Bayt reject
# logins from GitHub's datacenter IPs (dropped session / Cloudflare challenge), so the
# ubuntu-latest workflow cannot pass them no matter how the tests are written.
#
# Enable the schedule below once the runner is registered and shows as Idle under
# Settings -> Actions -> Runners. Until then this is manual-dispatch only, so runs do
# not pile up in the queue waiting for a runner that does not exist yet.

on:
  workflow_dispatch:
  schedule:
    # UTC. IST = UTC+5:30 -> 10:30, 12:30, 15:30 IST, Monday-Saturday
    - cron: '0 5,7,10 * * 1-6'

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  playwright-tests:
    name: Run Playwright Tests
    timeout-minutes: 30
    runs-on: self-hosted

    env:
      GULF_NAUKRI_EMAIL: ${{ secrets.GULF_NAUKRI_EMAIL }}
      GULF_NAUKRI_PASSWORD: ${{ secrets.GULF_NAUKRI_PASSWORD }}
      NAUKRI_USER_1_EMAIL: ${{ secrets.NAUKRI_USER_1_EMAIL }}
      NAUKRI_USER_1_PASSWORD: ${{ secrets.NAUKRI_USER_1_PASSWORD }}
      NAUKRI_USER_2_EMAIL: ${{ secrets.NAUKRI_USER_2_EMAIL }}
      NAUKRI_USER_2_PASSWORD: ${{ secrets.NAUKRI_USER_2_PASSWORD }}
      NAUKRI_USER_3_EMAIL: ${{ secrets.NAUKRI_USER_3_EMAIL }}
      NAUKRI_USER_3_PASSWORD: ${{ secrets.NAUKRI_USER_3_PASSWORD }}
      BAYT_EMAIL: ${{ secrets.BAYT_EMAIL }}
      BAYT_PASSWORD: ${{ secrets.BAYT_PASSWORD }}
      FOUNDIT_EMAIL: ${{ secrets.FOUNDIT_EMAIL }}
      FOUNDIT_PASSWORD: ${{ secrets.FOUNDIT_PASSWORD }}
      GULFTALENT_EMAIL: ${{ secrets.GULFTALENT_EMAIL }}
      GULFTALENT_PASSWORD: ${{ secrets.GULFTALENT_PASSWORD }}
      INDEED_EMAIL: ${{ secrets.INDEED_EMAIL }}
      INDEED_PASSWORD: ${{ secrets.INDEED_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - run: npm ci
      - run: npx playwright install chromium

      # Headed on a real desktop session — no xvfb needed, and the portals see a normal
      # browser from a residential IP. india + international cover every test once.
      - name: Run tests
        run: npx playwright test --project=india --project=international

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
